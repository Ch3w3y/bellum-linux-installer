# CI checks for the Bellum Linux installer.
#
# Policy:
# - Only static analysis, unit tests, and compile-only builds run here.
# - CI must never execute the installer, download runtime artifacts, or mutate
#   Wine prefixes. Installer side effects are validated manually (see TES-12).
# - `go mod tidy` is forbidden in CI and in builds: go.mod/go.sum are pinned by
#   hand and verified with `go mod verify` and `git diff --exit-code`.
name: CI

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    name: gofmt / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Vulnerability check
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Module pinning is clean (no go mod tidy drift)
        run: |
          go mod verify
          go mod tidy -diff

  build-linux:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries (compile-only, no installer side effects)
        run: |
          mkdir -p /tmp/bellum-ci/${{ matrix.arch }}
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath \
            -o /tmp/bellum-ci/${{ matrix.arch }}/installer ./bellum-installer
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath \
            -o /tmp/bellum-ci/${{ matrix.arch }}/uninstaller ./bellum-uninstaller
