# Deletes one branch on request (Actions tab → "Delete branch" → Run
# workflow). Refuses the default branch. Useful from environments where git
# cannot delete remote refs directly.
name: Delete branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to delete
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid branch name" >&2; exit 1; }
          [ "$BRANCH" != "$DEFAULT" ] || { echo "Refusing to delete the default branch" >&2; exit 1; }
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          echo "Deleted $BRANCH"
