name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  # Also startable from the Actions tab: creates the tag at the selected
  # branch's head, then runs the same pipeline. (Tags pushed with the
  # workflow token don't trigger workflows, so tagging happens in here.)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v2.2.0-rc.1 (candidates publish as pre-releases)'
        required: true
        type: string

permissions:
  contents: read

# Serialize version allocation and publication, including manual releases.
# GitHub coalesces pending runs; a newer main commit includes earlier merges.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Never use PR/fork CI runs as a privileged release trigger.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select and create the tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$EVENT" = workflow_run ]; then
            # A delayed CI completion must not publish an obsolete main head.
            main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
            if [ "$sha" != "$main_sha" ]; then
              echo 'Skipping superseded main commit.'
              exit 0
            fi
            tag=$(scripts/next-release-tag.sh)
          else
            tag=$REQUESTED_TAG
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[0-9]+)?$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$tag" -f sha="$sha"
          fi
          # Rerunning successful CI must not rebuild or replace a release.
          # Listing releases (rather than treating any API error as 'absent')
          # makes authentication/network errors fail closed.
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')
          if grep -Fxq "$tag" <<< "$existing"; then
            echo "Release $tag already exists."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check tag and clean tree
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git status --porcelain --untracked-files=all)" = ''
      - name: Code and vulnerability checks
        run: |
          go version
          make check
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          GOARCH=${{ matrix.arch }} "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build and verify release
        env:
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          make release VERSION="${TAG#v}"
          make verify-release VERSION="${TAG#v}"
          go version -m "dist/bellum-installer-linux-${GOARCH}-${TAG#v}/installer"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [tag, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # Automatic patches publish without the manual release approval gate.
    environment: ${{ github.event_name == 'workflow_run' && 'automatic-release' || 'release' }}
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set and checksums
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          scripts/check-release-assets.sh "${TAG#v}" dist
      - name: Generate complete release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          python3 scripts/release-notes.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release assets
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then
            printf '\nRelease candidate for hardware testing. Install with: curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | bash -s -- --version %s\n' "$GITHUB_REPOSITORY" "$TAG" >> "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          elif [ "$EVENT" = workflow_run ]; then
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
