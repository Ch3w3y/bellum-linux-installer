name: Tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
      - name: Check tag and release gate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(git describe --tags --exact-match)" = "$TAG"
          test "$(git status --porcelain --untracked-files=all)" = ''
          test -f RELEASE-GATE.md
          scripts/check-release-gate.sh "$GITHUB_SHA" RELEASE-GATE.md
      - name: Code and vulnerability checks
        run: |
          go version
          make check
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          GOARCH=${{ matrix.arch }} "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build and verify release
        env:
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          make release VERSION="${TAG#v}"
          make verify-release VERSION="${TAG#v}"
          go version -m "dist/bellum-installer-linux-${GOARCH}-${TAG#v}/installer"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/check-release-assets.sh "${TAG#v}" dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --draft
