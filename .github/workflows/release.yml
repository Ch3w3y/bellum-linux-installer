name: Tagged release

on:
  push:
    tags: ['v*']
  # Also startable from the Actions tab: creates the tag at the selected
  # branch's head, then runs the same pipeline. (Tags pushed with the
  # workflow token don't trigger workflows, so tagging happens in here.)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v2.2.0-rc.1 (candidates publish as pre-releases)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "Tag must look like v1.2.3 or v1.2.3-rc.1" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          echo "Tagged $GITHUB_SHA as $TAG"

  build:
    needs: tag
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
          # The gate compares the release with the tested candidate commit.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
      - name: Check tag and release gate
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(git describe --tags --exact-match)" = "$TAG"
          test "$(git status --porcelain --untracked-files=all)" = ''
          test -f RELEASE-GATE.md
          # Release candidates (vX.Y.Z-rc.N) exist to gather the QA and EAC
          # evidence the gate asks for, so they skip it and publish as
          # pre-releases that the one-line installer never picks by default.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Release candidate $TAG: evidence gate deferred to the final release."
          else
            scripts/check-release-gate.sh "$(git rev-parse HEAD)" RELEASE-GATE.md
          fi
      - name: Code and vulnerability checks
        run: |
          go version
          make check
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          GOARCH=${{ matrix.arch }} "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build and verify release
        env:
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          make release VERSION="${TAG#v}"
          make verify-release VERSION="${TAG#v}"
          go version -m "dist/bellum-installer-linux-${GOARCH}-${TAG#v}/installer"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set and checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          scripts/check-release-assets.sh "${TAG#v}" dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --prerelease \
              --notes "Release candidate for hardware testing. Install with: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash -s -- --version $TAG"
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --draft
          fi
